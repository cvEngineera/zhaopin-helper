name: 打包

on:
  push:
    branches: [main]
    # 只改 dist 或文档时不重复触发，避免自己提交自己
    paths-ignore:
      - 'dist/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 单元测试
        run: node test/logic.test.js

      - name: 打包（内含敏感信息闸门）
        run: node tools/pack.mjs

      - name: 提交 dist 产物
        run: |
          if [ -z "$(git status --porcelain dist)" ]; then
            echo "::notice::dist 无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "自动打包 dist（$(date -u +%Y-%m-%d)）"
          git push
